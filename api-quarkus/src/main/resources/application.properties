# =====================================================================
# Smartex Sustway — API Quarkus — configuration
# =====================================================================

quarkus.application.name=api-quarkus

# URL publique de l'API — utilisée pour construire des liens absolus
# (ex. lien de vérification email dans EmailService).
smartex.api.base-url=${SMARTEX_API_BASE_URL:http://localhost:8080}

# URL publique du frontend — le lien de vérification email (RG36) pointe
# ici (page /verification-email, qui appelle l'API elle-même) plutôt que
# directement sur l'API, pour ne pas exposer du JSON brut au clic.
smartex.frontend.base-url=${SMARTEX_FRONTEND_BASE_URL:http://localhost:5173}

# RG36 : vérification email obligatoire, y compris en dev maintenant que
# l'envoi réel (Brevo) est branché — voir AuthResourceTest, qui teste
# explicitement ce comportement.

# --- Datasource PostgreSQL ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${SMARTEX_DB_USER:smartex}
quarkus.datasource.password=${SMARTEX_DB_PASSWORD:smartex}
quarkus.datasource.jdbc.url=${SMARTEX_DB_URL:jdbc:postgresql://localhost:5432/smartex_sustway}
# Délai d'acquisition par défaut (5s) trop court pour une base serverless à
# froid (ex. Neon, qui suspend son instance après inactivité — le réveil
# peut prendre plusieurs secondes) : sans ceci, Flyway échoue au tout premier
# démarrage après une période d'inactivité de l'hébergement gratuit.
quarkus.datasource.jdbc.acquisition-timeout=30
quarkus.flyway.connect-retries=5
quarkus.flyway.connect-retries-interval=5

# Le schéma de référence est versionné dans database/migrations à la racine du repo
# (exécutable directement via psql). Les mêmes scripts sont dupliqués ici au format
# Flyway (V{n}__description.sql) pour la migration automatique au démarrage de l'API.
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# La base a été initialisée manuellement via psql (database/migrations/*.sql,
# appliqués avant que l'API n'existe) plutôt que par Flyway lui-même. Sans ce
# baseline, Flyway refuse de migrer un schéma "non vide" dont il ignore
# l'historique ("Found non-empty schema... but no schema history table").
# baseline-version=4 car V1 (schéma), V2 (seed rôles/criticité/formules),
# V3 (seed pays) et V4 (fix utilisateur_entreprise) ont déjà tous été
# appliqués à la main — Flyway les considère donc acquis et n'exécutera que
# les migrations futures (V5 et plus).
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=4

# --- Redis (cache) ---
quarkus.redis.hosts=${SMARTEX_REDIS_URL:redis://localhost:6379}

# --- Email (vérification de compte, RG36) ---
# Fournisseur retenu : Brevo (relais SMTP simple, 300 emails/jour gratuits sans
# limite de temps). Identifiants à définir dans un fichier .env non versionné
# (voir .env.example) — jamais en dur ici. En l'absence de configuration
# (dev sans compte Brevo), l'envoi échoue silencieusement côté EmailService
# (log warning) : l'inscription reste fonctionnelle, le lien de vérification
# continue d'être journalisé par AuthResource comme filet de sécurité.
quarkus.mailer.from=${SMARTEX_MAIL_FROM:no-reply@smartex-sustway.local}
quarkus.mailer.host=${SMARTEX_MAIL_HOST:smtp-relay.brevo.com}
quarkus.mailer.port=${SMARTEX_MAIL_PORT:587}
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.username=${SMARTEX_MAIL_USERNAME:}
quarkus.mailer.password=${SMARTEX_MAIL_PASSWORD:}
# Envoi réel activé uniquement en dev (et en "prod" le jour venu) — jamais en test.
%dev.quarkus.mailer.mock=false
%test.quarkus.mailer.mock=true

# --- Stockage documentaire (S3/MinIO) — RG15 ---
quarkus.s3.endpoint-override=${SMARTEX_S3_ENDPOINT:http://localhost:9000}
quarkus.s3.path-style-access=true
# Client Apache plutôt que le "url" par défaut (HttpsURLConnection du JDK) —
# ce dernier échoue en handshake_failure contre le TLS de Cloudflare R2 (voir
# la dépendance apache-client dans pom.xml, exigée dès que ce type est choisi).
quarkus.s3.sync-client.type=apache
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${SMARTEX_S3_ACCESS_KEY:smartex}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${SMARTEX_S3_SECRET_KEY:smartex_minio_secret}
# On a déjà notre propre MinIO (docker-compose) : pas de conteneur auto.
quarkus.s3.devservices.enabled=false
smartex.storage.bucket=${SMARTEX_S3_BUCKET:smartex-documents}

# Taille max d'upload — au-delà, 413 renvoyé automatiquement par Quarkus.
# Valeur de départ raisonnable pour des pièces justificatives (PDF/photos/
# tableurs) ; à ajuster si besoin, pas de contrainte imposée par le CDC.
quarkus.http.limits.max-body-size=20M

# --- Antivirus (exigence sécurité §1.4) — ClamAV, protocole clamd INSTREAM ---
smartex.antivirus.host=${SMARTEX_CLAMAV_HOST:localhost}
smartex.antivirus.port=${SMARTEX_CLAMAV_PORT:3310}
smartex.antivirus.timeout-ms=${SMARTEX_CLAMAV_TIMEOUT_MS:15000}
# Politique par défaut : si le scan échoue (ClamAV injoignable/erreur), on
# REFUSE l'upload plutôt que de stocker un fichier non scanné (fail-closed —
# cohérent avec une exigence de sécurité explicite du CDC). Assoupli
# UNIQUEMENT en dev, même logique que verification-email-obligatoire :
# permet de travailler sans ClamAV démarré localement, sans jamais
# atteindre le comportement non sécurisé en test ou par défaut.
smartex.antivirus.echec-bloquant=${SMARTEX_ANTIVIRUS_ECHEC_BLOQUANT:true}
%dev.smartex.antivirus.echec-bloquant=false

# --- Client REST vers services-ia-python (RG21/RG27/RG38) ---
quarkus.rest-client.services-ia.url=${SMARTEX_IA_SERVICE_URL:http://localhost:8000}
# Timeout généreux : la chaîne complète (Document + Evidence/Compliance +
# Risque + Recommandation) dépasse la minute avec plusieurs documents.
quarkus.rest-client.services-ia.connect-timeout=5000
quarkus.rest-client.services-ia.read-timeout=${SMARTEX_IA_READ_TIMEOUT_MS:180000}

# RG38 : seuil de confiance IA déclenchant la revue experte (formule
# Avancées). Même valeur que côté Python (services-ia-python/app/config.py,
# confiance_seuil_revue_experte) — dupliquée car chaque service applique sa
# propre logique métier sur cette même constante (Python compose ses
# résultats, Quarkus décide de la création de la revue), volontairement
# sans dépendance croisée entre les deux services pour ce seuil.
smartex.evaluation.seuil-confiance-revue-experte=0.80

# --- Client REST vers les services IA Python (REST/gRPC synchrone, décision actée §13) ---
services-ia.mp-rest/url=${SMARTEX_IA_SERVICE_URL:http://localhost:8000}

# --- Sécurité / JWT ---
mp.jwt.verify.issuer=${SMARTEX_JWT_ISSUER:https://smartex-sustway.local}
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem

# --- CORS (frontend React en dev) ---
quarkus.http.cors=true
quarkus.http.cors.origins=${SMARTEX_CORS_ORIGINS:http://localhost:5173}

# --- OpenAPI / Swagger UI ---
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/api/swagger-ui

# --- Health ---
quarkus.smallrye-health.root-path=/q/health

# --- Logs ---
quarkus.log.level=INFO
quarkus.log.category."com.smartexsustway".level=DEBUG

# --- Profil dev ---
%dev.quarkus.datasource.username=smartex
%dev.quarkus.datasource.password=smartex
%dev.quarkus.hibernate-orm.log.sql=true

# --- Profil test ---
# H2 a été abandonné : nos entités utilisent des types ENUM natifs PostgreSQL
# (@JdbcTypeCode(SqlTypes.NAMED_ENUM) sur statut/taille...), qu'H2 ne sait pas
# créer via la génération automatique de schéma Hibernate — d'où l'échec
# "ColumnDefinitions.appendColumn" au boot des tests.
# Solution pragmatique phase B : les tests utilisent la même base PostgreSQL
# que le mode dev (localhost:5432/smartex_sustway), avec Flyway (pas de
# génération automatique de schéma, comme en prod). Limite connue : les tests
# ne sont pas isolés d'une vraie base locale. À remplacer par Testcontainers
# (Dev Services Quarkus, activé automatiquement si Docker est disponible et
# qu'aucune URL n'est configurée ici) dès que Docker sera utilisé couramment
# dans le poste de dev — il suffira alors de supprimer ce bloc %test.* entier.
%test.quarkus.datasource.username=smartex
%test.quarkus.datasource.password=smartex
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.flyway.migrate-at-start=true
