name: CI — Smartex Sustway

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # ---------------------------------------------------------------
  # Base de données : valide le DDL sur un vrai PostgreSQL éphémère
  # ---------------------------------------------------------------
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartex
          POSTGRES_PASSWORD: smartex
          POSTGRES_DB: smartex_sustway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartex -d smartex_sustway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer le schéma (migrations)
        env:
          PGPASSWORD: smartex
        run: |
          for f in database/migrations/*.sql; do
            echo "→ $f"
            psql -h localhost -U smartex -d smartex_sustway -f "$f"
          done
      - name: Charger les seeds
        env:
          PGPASSWORD: smartex
        run: |
          for f in database/seeds/*.sql; do
            echo "→ $f"
            psql -h localhost -U smartex -d smartex_sustway -f "$f"
          done

  # ---------------------------------------------------------------
  # Services IA (Python / FastAPI)
  # ---------------------------------------------------------------
  services-ia-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services-ia-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services-ia-python/requirements.txt
      - run: pip install -r requirements.txt pytest ruff
      - name: Lint (ruff)
        run: ruff check app
      - name: Tests (pytest)
        run: pytest -v

  # ---------------------------------------------------------------
  # API (Quarkus / Java)
  # ---------------------------------------------------------------
  api-quarkus:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-quarkus
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartex
          POSTGRES_PASSWORD: smartex
          POSTGRES_DB: smartex_sustway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartex -d smartex_sustway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: MinIO (stockage documentaire attendu au démarrage de l'API)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=smartex -e MINIO_ROOT_PASSWORD=smartex_minio_secret \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO n'a pas démarré" && exit 1
      - name: ClamAV (scan à l'upload, échec bloquant hors profil dev)
        run: |
          docker run -d --name clamav -p 3310:3310 clamav/clamav:stable
          for _ in $(seq 1 60); do
            if docker exec clamav clamdcheck.sh >/dev/null 2>&1; then exit 0; fi
            sleep 5
          done
          echo "clamd n'a pas démarré" && exit 1
      - name: Clés JWT de test (les .pem réels ne sont pas versionnés)
        run: |
          openssl genpkey -algorithm RSA -out src/main/resources/privateKey.pem -pkeyopt rsa_keygen_bits:2048
          openssl rsa -pubout -in src/main/resources/privateKey.pem -out src/main/resources/publicKey.pem
      - name: Build & tests (profil test, PostgreSQL + Flyway)
        run: mvn -B verify

  # ---------------------------------------------------------------
  # Frontend (React / Vite)
  # ---------------------------------------------------------------
  frontend-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
