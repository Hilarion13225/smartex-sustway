<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Satoshi vient de Fontshare (Indian Type Foundry), pas de Google Fonts :
         « 100% free for personal and commercial use », licence ITF FFL 2.0, qui
         couvre explicitement la livraison par leur API. -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f%5B%5D=satoshi@400,500,700,900,501,701&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>SMARTEX SustWay — Évaluation RSE intelligente</title>
    <script>
      // Applique le thème AVANT le premier rendu React (évite un flash de
      // thème clair au chargement si l'utilisateur a choisi sombre/système).
      // Miroir exact de la logique de src/theme/ThemeContext.jsx.
      (function () {
        // La page d'entrée impose le sombre (voir useSombreForce dans
        // ThemeContext) : sans ce cas particulier, un visiteur en préférence
        // claire verrait un flash blanc avant que React ne force le sombre.
        if (window.location.pathname === '/') {
          // `dark-force` distingue ce sombre impose du sombre choisi : la
          // vitrine ne suit plus le second, mais garde le premier.
          document.documentElement.classList.add('dark', 'dark-force');
          return;
        }
        try {
          var preference = localStorage.getItem('smartex.theme') || 'systeme';
          var sombre =
            preference === 'sombre' ||
            (preference === 'systeme' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (sombre) document.documentElement.classList.add('dark');
        } catch (e) {
          // localStorage indisponible (navigation privée stricte...) : reste en clair.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
