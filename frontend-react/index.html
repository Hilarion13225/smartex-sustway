<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Smartex Sustway — Évaluation RSE intelligente</title>
    <script>
      // Applique le thème AVANT le premier rendu React (évite un flash de
      // thème clair au chargement si l'utilisateur a choisi sombre/système).
      // Miroir exact de la logique de src/theme/ThemeContext.jsx.
      (function () {
        try {
          var preference = localStorage.getItem('smartex.theme') || 'systeme';
          var sombre =
            preference === 'sombre' ||
            (preference === 'systeme' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (sombre) document.documentElement.classList.add('dark');
        } catch (e) {
          // localStorage indisponible (navigation privée stricte...) : reste en clair.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
