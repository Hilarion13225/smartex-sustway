<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SMARTEX SustWay">
  <!--
    Favicon derive du logotype, et non dessine pour l'occasion : c'est la
    feuille que Logo.jsx pose sur le « SustWay », avec sa rotation de 18 degres
    et le meme trace (icone Leaf de lucide, ISC).

    Le logotype entier ne pouvait pas servir : « SMARTEX SustWay » est du
    texte, illisible des 32 px. Reste ce qui se reconnait a cette taille.

    Fond Forest plein (variable CSS forest, 25 62 44) plutot qu'une feuille
    transparente : un onglet peut etre clair ou sombre, et une feuille verte
    sans fond disparaissait sur l'un des deux. Le carre plein tient partout.

    Feuille en Growth (variable CSS growth, 205 219 166) : 8,9:1 sur le Forest,
    tres au-dela des 4,5:1 demandes. A 16 px un contraste juste suffisant ne
    suffit pas, les traits faisant moins d'un pixel.
  -->
  <rect width="64" height="64" rx="14" fill="#193E2C" />
  <g transform="translate(32 32) rotate(18) scale(1.95) translate(-12 -12)">
    <g fill="none" stroke="#CDDBA6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
      <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
    </g>
  </g>
</svg>
