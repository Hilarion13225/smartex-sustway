# =====================================================================
# Smartex Sustway — Environnement de développement local
# Phase A du plan de projet
# =====================================================================
# Usage :
#   docker compose up -d postgres redis minio        # infra seule
#   docker compose up -d                              # stack complète (api, ia, front)
#   docker compose --profile tools up -d adminer      # + outils d'administration
# =====================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: smartex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartex
      POSTGRES_PASSWORD: smartex
      POSTGRES_DB: smartex_sustway
    ports:
      - "5432:5432"
    volumes:
      - smartex_postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d/01-migrations:ro
      - ./database/seeds:/docker-entrypoint-initdb.d/02-seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartex -d smartex_sustway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smartex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - smartex_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: smartex-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smartex
      MINIO_ROOT_PASSWORD: smartex_minio_secret
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - smartex_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    # Antivirus (exigence sécurité §1.4 : scan à l'upload). Image officielle
    # ClamAV avec clamd exposé en TCP (protocole INSTREAM, voir
    # AntivirusService côté api-quarkus). Premier démarrage lent (plusieurs
    # minutes) : téléchargement des signatures virales. Le healthcheck
    # attend que clamd réponde avant de considérer le service prêt.
    image: clamav/clamav:stable
    container_name: smartex-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - smartex_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  services-ia-python:
    build:
      context: ./services-ia-python
    container_name: smartex-ia
    restart: unless-stopped
    environment:
      SMARTEX_ENV: dev
      SMARTEX_DATABASE_URL: postgresql://smartex:smartex@postgres:5432/smartex_sustway
      SMARTEX_REDIS_URL: redis://redis:6379/0
      SMARTEX_S3_ENDPOINT: http://minio:9000
      SMARTEX_API_QUARKUS_BASE_URL: http://api-quarkus:8080
      # Clé Gemini (Google AI Studio, palier gratuit) lue depuis votre .env
      # local — voir README, section "Agents IA" pour la mise en garde sur
      # le palier gratuit et la marche à suivre pour obtenir une clé.
      SMARTEX_GEMINI_API_KEY: ${SMARTEX_GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./services-ia-python/app:/app/app

  api-quarkus:
    build:
      context: ./api-quarkus
    container_name: smartex-api
    restart: unless-stopped
    environment:
      SMARTEX_DB_URL: jdbc:postgresql://postgres:5432/smartex_sustway
      SMARTEX_DB_USER: smartex
      SMARTEX_DB_PASSWORD: smartex
      SMARTEX_REDIS_URL: redis://redis:6379
      SMARTEX_IA_SERVICE_URL: http://services-ia-python:8000
      SMARTEX_CORS_ORIGINS: http://localhost:5173
      SMARTEX_API_BASE_URL: http://localhost:8080
      # Identifiants Brevo lus depuis votre environnement/fichier .env local
      # (docker compose les substitue automatiquement s'ils sont exportés,
      # sinon la valeur par défaut vide désactive l'envoi réel — voir
      # EmailService, dégradation silencieuse).
      SMARTEX_MAIL_HOST: ${SMARTEX_MAIL_HOST:-smtp-relay.brevo.com}
      SMARTEX_MAIL_PORT: ${SMARTEX_MAIL_PORT:-587}
      SMARTEX_MAIL_USERNAME: ${SMARTEX_MAIL_USERNAME:-}
      SMARTEX_MAIL_PASSWORD: ${SMARTEX_MAIL_PASSWORD:-}
      SMARTEX_MAIL_FROM: ${SMARTEX_MAIL_FROM:-no-reply@smartex-sustway.local}
      # Stockage documentaire (S3/MinIO) et antivirus (§1.4)
      SMARTEX_S3_ENDPOINT: http://minio:9000
      SMARTEX_S3_ACCESS_KEY: smartex
      SMARTEX_S3_SECRET_KEY: smartex_minio_secret
      SMARTEX_S3_BUCKET: smartex-documents
      SMARTEX_CLAMAV_HOST: clamav
      SMARTEX_CLAMAV_PORT: 3310
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      services-ia-python:
        condition: service_started
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy

  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile.dev
    container_name: smartex-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-react/src:/app/src
    depends_on:
      - api-quarkus

  # --- Outils d'administration (optionnels, profil "tools") ---
  adminer:
    image: adminer:latest
    container_name: smartex-adminer
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  smartex_postgres_data:
  smartex_redis_data:
  smartex_minio_data:
  smartex_clamav_data:
