# =====================================================================
# Smartex Sustway — Environnement de développement local
# Phase A du plan de projet
# =====================================================================
# Usage :
#   docker compose up -d postgres redis minio        # infra seule
#   docker compose up -d                              # stack complète (api, ia, front)
#   docker compose --profile tools up -d adminer      # + outils d'administration
# =====================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: smartex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartex
      POSTGRES_PASSWORD: smartex
      POSTGRES_DB: smartex_sustway
    ports:
      # Hôte 5433 : le port 5432 par défaut est déjà occupé sur cette machine
      # par le Postgres d'un autre projet (cie-smart-prepaid-poc). Le réseau
      # Docker interne continue d'utiliser 5432 (voir SMARTEX_DB_URL ci-dessous).
      - "5433:5432"
    volumes:
      - smartex_postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d/01-migrations:ro
      - ./database/seeds:/docker-entrypoint-initdb.d/02-seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartex -d smartex_sustway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smartex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - smartex_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: smartex-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smartex
      MINIO_ROOT_PASSWORD: smartex_minio_secret
    ports:
      # Hôte 9002/9003 : 9000/9001 déjà occupés sur cette machine par un
      # autre projet local (cie-smart-prepaid-poc). Le réseau Docker interne
      # continue d'utiliser 9000/9001 (voir SMARTEX_S3_ENDPOINT ci-dessous).
      - "9002:9000"   # API S3
      - "9003:9001"   # Console web
    volumes:
      - smartex_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    # Antivirus (exigence sécurité §1.4 : scan à l'upload). Image officielle
    # ClamAV avec clamd exposé en TCP (protocole INSTREAM, voir
    # AntivirusService côté api-quarkus). Premier démarrage lent (plusieurs
    # minutes) : téléchargement des signatures virales. Le healthcheck
    # attend que clamd réponde avant de considérer le service prêt.
    image: clamav/clamav:stable
    container_name: smartex-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - smartex_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  services-ia-python:
    build:
      context: ./services-ia-python
    container_name: smartex-ia
    restart: unless-stopped
    environment:
      SMARTEX_ENV: dev
      SMARTEX_DATABASE_URL: postgresql://smartex:smartex@postgres:5432/smartex_sustway
      SMARTEX_REDIS_URL: redis://redis:6379/0
      SMARTEX_S3_ENDPOINT: http://minio:9000
      SMARTEX_API_QUARKUS_BASE_URL: http://api-quarkus:8080
      # Clé Gemini (Google AI Studio, palier gratuit) lue depuis votre .env
      # local — voir README, section "Agents IA" pour la mise en garde sur
      # le palier gratuit et la marche à suivre pour obtenir une clé.
      SMARTEX_GEMINI_API_KEY: ${SMARTEX_GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./services-ia-python/app:/app/app

  api-quarkus:
    build:
      context: ./api-quarkus
    container_name: smartex-api
    restart: unless-stopped
    environment:
      # Active le profil %dev de Quarkus dans le jar packagé (l'image est
      # buildée en mode "package" normal, pas "quarkus:dev" — sans cette
      # variable, les propriétés préfixées %dev.* de application.properties
      # (vérification email non obligatoire, échec antivirus non bloquant,
      # etc.) ne s'appliquent jamais et le compte reste "non actif" tant que
      # l'email de vérification n'a pas été cliqué). À retirer avant toute
      # mise en production réelle (voir application.properties, RG36).
      QUARKUS_PROFILE: dev
      SMARTEX_DB_URL: jdbc:postgresql://postgres:5432/smartex_sustway
      SMARTEX_DB_USER: smartex
      SMARTEX_DB_PASSWORD: smartex
      SMARTEX_REDIS_URL: redis://redis:6379
      SMARTEX_IA_SERVICE_URL: http://services-ia-python:8000
      # Les deux origines sont acceptees : localhost (poste de dev) et l'IP
      # locale du poste sur le Wi-Fi (test depuis un telephone sur le meme
      # reseau) - a ajuster si l'IP change (voir "ipconfig"/Get-NetIPAddress).
      # 127.0.0.1:5176 / localhost:5176 : serveur Vite natif (hors Docker),
      # utilise pour les verifications rapides sans reconstruire l'image.
      SMARTEX_CORS_ORIGINS: http://localhost:5175,http://192.168.1.12:5175,http://127.0.0.1:5176,http://localhost:5176,http://192.168.1.12:5176
      SMARTEX_API_BASE_URL: http://localhost:8090
      # Sans cette variable, les liens envoyes par email (verification de
      # compte, reinitialisation de mot de passe, invitation) retombent sur
      # le defaut de application.properties (localhost:5173) - un port qui
      # n'est plus le notre depuis le remappage, et sur lequel un autre
      # projet local repond : le clic sur le lien n'active jamais le compte.
      SMARTEX_FRONTEND_BASE_URL: http://localhost:5175
      # Clé API Brevo lue depuis votre environnement/fichier .env local (API
      # HTTP, pas SMTP — voir EmailService pour le pourquoi) ; docker compose
      # la substitue automatiquement si exportée, sinon la valeur par défaut
      # vide désactive l'envoi réel — voir EmailService, dégradation silencieuse.
      SMARTEX_MAIL_API_KEY: ${SMARTEX_MAIL_API_KEY:-}
      SMARTEX_MAIL_FROM: ${SMARTEX_MAIL_FROM:-no-reply@smartex-sustway.local}
      # Stockage documentaire (S3/MinIO) et antivirus (§1.4)
      SMARTEX_S3_ENDPOINT: http://minio:9000
      SMARTEX_S3_ACCESS_KEY: smartex
      SMARTEX_S3_SECRET_KEY: smartex_minio_secret
      SMARTEX_S3_BUCKET: smartex-documents
      SMARTEX_CLAMAV_HOST: clamav
      SMARTEX_CLAMAV_PORT: 3310
    ports:
      # Hôte 8090 : le port 8080 par défaut est déjà occupé sur cette machine
      # par le backend d'un autre projet (cie-smart-prepaid-poc).
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
      services-ia-python:
        condition: service_started
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy

  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile.dev
    container_name: smartex-frontend
    restart: unless-stopped
    environment:
      # IP locale (Wi-Fi) plutot que "localhost" : depuis le telephone, "localhost"
      # designerait le telephone lui-meme, pas ce poste. Fonctionne aussi depuis
      # ce poste (le trafic vers sa propre IP locale est route normalement).
      VITE_API_BASE_URL: http://192.168.1.12:8090
    ports:
      # Hôte 5175 : 5173 et 5174 sont déjà occupés par des processus Node
      # natifs hors Docker (autres projets sur cette machine) — voir README.
      - "5175:5173"
    volumes:
      - ./frontend-react/src:/app/src
      # Assets statiques (bannières vidéo, favicon...) : sans ce montage, le
      # conteneur ne voit que public/ tel qu'il était au dernier build de
      # l'image, donc un fichier ajouté après coup (ex. vidéo de bannière) y
      # est introuvable (Vite retombe alors sur index.html avec un 200 trompeur).
      - ./frontend-react/public:/app/public
      # Fichiers de config à la racine : sans ce montage, le conteneur garde
      # la version figée au dernier build de l'image (ex. tailwind.config.js
      # sans une classe/couleur ajoutée depuis -> "The `xxx` class does not
      # exist" en pleine page malgré un fichier local à jour).
      - ./frontend-react/tailwind.config.js:/app/tailwind.config.js
      - ./frontend-react/postcss.config.js:/app/postcss.config.js
      - ./frontend-react/vite.config.js:/app/vite.config.js
      - ./frontend-react/index.html:/app/index.html
    depends_on:
      - api-quarkus

  # --- Outils d'administration (optionnels, profil "tools") ---
  adminer:
    image: adminer:latest
    container_name: smartex-adminer
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  smartex_postgres_data:
  smartex_redis_data:
  smartex_minio_data:
  smartex_clamav_data:
